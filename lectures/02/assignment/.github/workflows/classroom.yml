name: Assignment 02 Autograding

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build assignment notebook
        run: |
          python -m jupytext --to notebook assignment.md -o assignment.ipynb

      - name: Run tests
        run: |
          pytest .github/tests/test_pipeline.py -v
