# Data Dictionary: ICD-10 + HCPCS Assignment
# Synthetic claims-style data for Polars lazy/streaming assignment

version: 2.0
description: Synthetic ICD-10-CM diagnoses + HCPCS procedures focused on diabetes screening and monitoring

population:
  name: "Type 2 diabetes monitoring"
  target_icd_prefixes: ["E11"]
  related_icd_prefixes: ["Z13", "Z79"]
  icd_target_max: 40
  icd_related_max: 30
  hcpcs_keywords: ["glucose", "hemoglobin", "hba1c", "a1c", "lipid", "cholesterol", "insulin"]
  hcpcs_max: 60
  target_prevalence: 0.35

generation_defaults:
  default_size: medium
  patients_by_size:
    small: 1500
    medium: 6000
    large: 15000

site_size_ranges:
  Clinic:
    min: 600
    max: 2500
  Community Hospital:
    min: 2500
    max: 9000
  Regional Medical Center:
    min: 9000
    max: 25000

tables:
  sites:
    description: Clinical sites used for patient attribution
    columns:
      site_id:
        type: string
        description: Site identifier
        example: "SITE-001"
      site_name:
        type: string
        description: Display name for the site
        example: "Oakland Community Hospital"
      site_type:
        type: categorical
        description: Clinic vs hospital type
        values: ["Clinic", "Community Hospital", "Regional Medical Center"]
      patient_capacity:
        type: integer
        description: Approximate panel size for the site
        range: [600, 25000]

  patients:
    description: Patient demographics for the population
    columns:
      patient_id:
        type: string
        description: Patient identifier
        example: "PAT-000123"
      site_id:
        type: string
        description: Site attribution for the patient
        example: "SITE-001"
      dob:
        type: date
        description: Date of birth
        example: "1972-04-12"
      gender:
        type: categorical
        description: Patient gender
        values: ["F", "M", "X"]
      zip_code:
        type: string
        description: ZIP code
        example: "94110"

  records:
    description: Long-format diagnosis + procedure history
    columns:
      record_id:
        type: string
        description: Record identifier
        example: "REC-2024-00001234"
      patient_id:
        type: string
        description: Patient identifier
        example: "PAT-000123"
      site_id:
        type: string
        description: Site attribution
        example: "SITE-001"
      record_ts:
        type: datetime
        description: Timestamp for the coded event
        example: "2024-05-02T10:15:00"
      record_type:
        type: categorical
        description: Code system for the record
        values: ["ICD-10-CM", "HCPCS"]
      code:
        type: string
        description: ICD-10-CM or HCPCS code
        example: "E11.9"

  icd10_lookup:
    description: ICD-10-CM codes used in the assignment
    columns:
      code:
        type: string
        description: ICD-10-CM code
        example: "E11.9"
      short_description:
        type: string
        description: Short label
        example: "Type 2 diabetes mellitus without complications"
      long_description:
        type: string
        description: Longer code description
      category:
        type: string
        description: ICD-10 category (3-character prefix)
        example: "E11"

  hcpcs_lookup:
    description: HCPCS/CPT-style procedure codes used in the assignment
    columns:
      code:
        type: string
        description: HCPCS/CPT code
        example: "83036"
      description:
        type: string
        description: Procedure description
        example: "Hemoglobin A1c test"
      group:
        type: string
        description: Group label from DHS list
        example: "CLINICAL LABORATORY SERVICES"
